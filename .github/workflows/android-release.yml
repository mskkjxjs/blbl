name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 0.1.1)"
        required: true
      changelog:
        description: "Release notes/changelog (optional; supports multiline)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore
      - name: Build release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          CLEAN_VERSION="${VERSION_NAME#v}"
          NUMERIC_VERSION="${CLEAN_VERSION%%[-+]*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${NUMERIC_VERSION}"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          VERSION_CODE=$(( 1000000000 + 10#${MAJOR} * 10000000 + 10#${MINOR} * 100000 + 10#${PATCH} * 1000 + RUN_NUMBER % 1000 ))
          echo "Building ${CLEAN_VERSION} with versionCode ${VERSION_CODE}"
          ./gradlew assembleRelease -PversionName="${CLEAN_VERSION}" -PversionCode="${VERSION_CODE}"

          # Android rejects installs whose versionCode is lower than the installed one,
          # so never ship a small/regressing code (this caused "已安装更高版本" on update).
          META="app/build/outputs/apk/release/output-metadata.json"
          APK_CODE="$(jq -r '.elements[0].versionCode' "$META")"
          APK_NAME="$(jq -r '.elements[0].versionName' "$META")"
          echo "APK versionName=${APK_NAME} versionCode=${APK_CODE}"
          [ "$APK_NAME" = "${CLEAN_VERSION}" ]
          [ "$APK_CODE" = "${VERSION_CODE}" ]
      - name: Upload release APK to R2 (optional)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || vars.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX || secrets.R2_PREFIX }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ] || [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "R2 variables not set, skipping upload."
            exit 0
          fi
          if ! command -v aws >/dev/null 2>&1; then
            echo "aws cli not found, installing..."
            sudo apt-get update
            sudo apt-get install -y awscli
          fi

          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"
          export AWS_REGION="auto"
          export AWS_EC2_METADATA_DISABLED=true
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          CLEAN_VERSION="${VERSION_NAME#v}"
          KEY_PREFIX="${R2_PREFIX:-blbl}"
          KEY_PREFIX="${KEY_PREFIX%/}"
          if [ -n "${KEY_PREFIX}" ]; then
            KEY_PREFIX="${KEY_PREFIX}/"
          fi
          if [ ! -s CHANGELOG.md ]; then
            echo "CHANGELOG.md missing or empty."
            exit 1
          fi

          printf '%s' "${CLEAN_VERSION}" > version
          aws s3 cp "version" "s3://${R2_BUCKET}/${KEY_PREFIX}version" --endpoint-url "${ENDPOINT}" --content-type "text/plain" --cache-control "no-cache"
          aws s3 cp "CHANGELOG.md" "s3://${R2_BUCKET}/${KEY_PREFIX}CHANGELOG.md" --endpoint-url "${ENDPOINT}" --content-type "text/markdown; charset=utf-8" --cache-control "no-cache"
          aws s3 cp "app/build/outputs/apk/release/app-release.apk" "s3://${R2_BUCKET}/${KEY_PREFIX}blbl-${CLEAN_VERSION}-release.apk" --endpoint-url "${ENDPOINT}" --content-type "application/vnd.android.package-archive"
          aws s3 cp "app/build/outputs/apk/release/app-release.apk" "s3://${R2_BUCKET}/${KEY_PREFIX}blbl-latest-release.apk" --endpoint-url "${ENDPOINT}" --content-type "application/vnd.android.package-archive" --cache-control "no-cache"
      - name: Prepare named release APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          CLEAN_VERSION="${VERSION_NAME#v}"
          DOWNLOAD_APK="app/build/outputs/apk/release/blbl-android-${CLEAN_VERSION}-release.apk"
          cp "app/build/outputs/apk/release/app-release.apk" "${DOWNLOAD_APK}"
          echo "DOWNLOAD_APK=${DOWNLOAD_APK}" >> "${GITHUB_ENV}"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: blbl-android-${{ inputs.version_name }}-release
          path: ${{ env.DOWNLOAD_APK }}
      - name: Publish release APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_TAG: ${{ startsWith(inputs.version_name, 'v') && inputs.version_name || format('v{0}', inputs.version_name) }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ -n "${CHANGELOG:-}" ]; then
              printf '%s' "$CHANGELOG" > changelog.md
              gh release edit "$RELEASE_TAG" --notes-file changelog.md
            fi
          else
            if [ -n "${CHANGELOG:-}" ]; then
              printf '%s' "$CHANGELOG" > changelog.md
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file changelog.md --target "$GITHUB_SHA"
            else
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
            fi
          fi
          gh release upload "$RELEASE_TAG" "$DOWNLOAD_APK" --clobber
